<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель администратора — AR Меню</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f5f7;
      color: #1c1c1e;
      margin: 0;
      padding: 32px 16px;
    }
    .card {
      max-width: 680px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 24px; font-size: 22px; font-weight: 700; }
    
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      border-bottom: 1px solid #e5e5ea;
      padding-bottom: 10px;
    }
    .nav-tab {
      padding: 8px 16px;
      background: transparent;
      border: none;
      font-size: 15px;
      font-weight: 600;
      color: #8e8e93;
      cursor: pointer;
      border-radius: 8px;
    }
    .nav-tab.active { background: #f2f2f7; color: #1c1c1e; }
    
    .form-group { margin-bottom: 18px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #3a3a3c; }
    .req { color: #d70015; margin-left: 2px; }
    .input-wrapper { position: relative; display: flex; align-items: center; }
    input[type="text"], input[type="password"], input[type="number"], textarea {
      width: 100%; padding: 10px 12px; border: 1px solid #d1d1d6; border-radius: 8px; font-size: 14px; background: #fff;
    }
    input[type="text"]:focus, input[type="password"]:focus, input[type="number"]:focus, textarea:focus {
      outline: none; border-color: #007aff;
    }
    .eye-btn { position: absolute; right: 10px; background: none; border: none; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; }
    .eye-btn svg { width: 20px; height: 20px; stroke: #8e8e93; }
    textarea { resize: vertical; min-height: 80px; }
    input[type="file"] { width: 100%; padding: 8px; background: #f2f2f7; border-radius: 8px; font-size: 13px; border: 1px dashed #c7c7cc; }
    
    .btn-main { width: 100%; padding: 13px; border: none; border-radius: 10px; background: #007aff; color: #ffffff; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; text-align: center; text-decoration: none; }
    .btn-main:active { background: #0056b3; }
    .btn-small { padding: 6px 12px; font-size: 13px; background: #007aff; border-radius: 6px; color: white; text-decoration: none; display: inline-block; border: none; cursor: pointer; }
    .btn-danger { background: #ff3b30; }
    
    .status-box { margin-top: 20px; padding: 14px; border-radius: 8px; display: none; font-size: 14px; line-height: 1.4; }
    .status-box.success { display: block; background: #eaf7ec; color: #1b6e38; border: 1px solid #c8e6c9; }
    .status-box.error { display: block; background: #fdf2f2; color: #b71c1c; border: 1px solid #ffcdd2; }
    
    .qr-preview { margin-top: 14px; text-align: center; }
    .qr-preview img { max-width: 180px; border-radius: 10px; border: 1px solid #e5e5ea; padding: 8px; background: #fff; }
    
    #admin-workspace { display: none; }
    .workspace-view { display: none; }
    .workspace-view.active { display: block; }
    
    .catalog-list { display: flex; flex-direction: column; gap: 12px; }
    .catalog-item { background: #f2f2f7; padding: 16px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
    .catalog-item-info strong { display: block; font-size: 16px; margin-bottom: 4px; }
    .catalog-item-info span { font-size: 13px; color: #6c6c70; }
    .catalog-item-actions { display: flex; gap: 8px; }
  </style>
</head>
<body>

  <!-- Авторизация -->
  <div id="login-section" class="card">
    <h1>Авторизация администратора</h1>
    <form id="login-form">
      <div class="form-group">
        <label>Логин <span class="req">*</span></label>
        <input type="text" id="login-username" placeholder="admin" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label>Пароль <span class="req">*</span></label>
        <div class="input-wrapper">
          <input type="password" id="login-password" placeholder="admin123" autocomplete="current-password" required>
          <button type="button" class="eye-btn" onclick="togglePasswordVisibility('login-password')">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-main">Войти</button>
    </form>
    <div id="login-status" class="status-box"></div>
  </div>

  <!-- Рабочая зона -->
  <div id="admin-workspace" class="card">
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchTab('import')">Импорт блюда</button>
      <button class="nav-tab" onclick="switchTab('catalog'); loadCatalog();">Каталог блюд</button>
    </div>

    <!-- Вкладка Импорт -->
    <div id="tab-import" class="workspace-view active">
      <form id="upload-form">
        <div class="form-group">
          <label>Код блюда для URL (slug) <span class="req">*</span></label>
          <input type="text" id="dish-slug" name="slug" placeholder="например: burger" required>
        </div>
        <div class="form-group">
          <label>Название блюда <span class="req">*</span></label>
          <input type="text" id="dish-name" name="name" maxlength="120" placeholder="например: Классический бургер" required>
        </div>
        <div class="grid-4">
          <div class="form-group"><label>Ккал <span class="req">*</span></label><input type="number" id="dish-calories" name="calories" min="0" max="5000" step="1" required></div>
          <div class="form-group"><label>Белки <span class="req">*</span></label><input type="number" id="dish-protein" name="protein" min="0" max="500" step="0.1" required></div>
          <div class="form-group"><label>Жиры <span class="req">*</span></label><input type="number" id="dish-fat" name="fat" min="0" max="500" step="0.1" required></div>
          <div class="form-group"><label>Угл <span class="req">*</span></label><input type="number" id="dish-carbs" name="carbs" min="0" max="500" step="0.1" required></div>
        </div>
        <div class="form-group">
          <label>Полный состав блюда <span class="req">*</span></label>
          <textarea id="dish-composition" name="composition" maxlength="600" placeholder="Ингредиенты..." required></textarea>
        </div>
        <div class="form-group">
          <label>Основная 3D-модель (.glb) <span class="req">*</span></label>
          <input type="file" id="file-whole" name="file_whole" accept=".glb" required>
        </div>
        <div class="form-group">
          <label>3D-модель в разрезе (.glb, опционально)</label>
          <input type="file" id="file-cut" name="file_cut" accept=".glb">
        </div>
        <button type="submit" class="btn-main">Сохранить блюдо</button>
      </form>
      <div id="upload-status" class="status-box"></div>
    </div>

    <!-- Вкладка Каталог -->
    <div id="tab-catalog" class="workspace-view">
      <div id="catalog-list" class="catalog-list">
        Загрузка...
      </div>
      <div id="catalog-status" class="status-box"></div>
    </div>
  </div>

  <script>
    let currentAuthToken = '';
    const MAX_FILE_SIZE = 5 * 1024 * 1024;

    function togglePasswordVisibility(inputId) {
      const input = document.getElementById(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function switchTab(tabId) {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.workspace-view').forEach(v => v.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('tab-' + tabId).classList.add('active');
      document.getElementById('upload-status').style.display = '';
      document.getElementById('upload-status').className = 'status-box';
      document.getElementById('catalog-status').style.display = '';
      document.getElementById('catalog-status').className = 'status-box';
    }

    // Авторизация
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const loginStatus = document.getElementById('login-status');
      loginStatus.style.display = '';
      loginStatus.className = 'status-box';

      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Неверный логин или пароль');

        currentAuthToken = data.token;
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('admin-workspace').style.display = 'block';
      } catch (err) {
        loginStatus.className = 'status-box error';
        loginStatus.innerText = err.message;
      }
    });

    // Загрузка блюда
    document.getElementById('upload-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusBox = document.getElementById('upload-status');
      statusBox.style.display = '';
      statusBox.className = 'status-box';

      const slug = document.getElementById('dish-slug').value.trim();
      const name = document.getElementById('dish-name').value.trim();
      const composition = document.getElementById('dish-composition').value.trim();
      const fileWhole = document.getElementById('file-whole').files[0];
      const fileCut = document.getElementById('file-cut').files[0];

      if (!slug || !/^[a-z0-9_-]{2,50}$/.test(slug)) return showError(statusBox, 'Ошибка: Код блюда (slug) содержит недопустимые символы (используйте латиницу, дефис, подчеркивание).');
      if (!name || name.length < 2) return showError(statusBox, 'Ошибка: Название блюда не может быть пустым.');
      if (!composition || composition.length < 5) return showError(statusBox, 'Ошибка: Состав должен быть не менее 5 символов.');
      if (!fileWhole || !fileWhole.name.toLowerCase().endsWith('.glb')) return showError(statusBox, 'Ошибка: Основная модель должна быть формата .glb.');
      if (fileWhole.size > MAX_FILE_SIZE) return showError(statusBox, 'Ошибка: Файл слишком большой (>5 МБ).');
      if (fileCut && (!fileCut.name.toLowerCase().endsWith('.glb') || fileCut.size > MAX_FILE_SIZE)) return showError(statusBox, 'Ошибка: Модель в разрезе недопустимого формата или размера.');

      const formData = new FormData(e.target);
      formData.set('slug', slug); formData.set('name', name); formData.set('composition', composition);
      formData.append('admin_token', currentAuthToken);

      try {
        const res = await fetch('/api/dishes', { method: 'POST', body: formData });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Ошибка сохранения БД');

        const dishUrl = `${window.location.origin}/?dish=${data.slug}`;
        const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(dishUrl)}`;

        statusBox.className = 'status-box success';
        statusBox.innerHTML = `
          <strong>Успех!</strong><br><a href="${dishUrl}" target="_blank">${dishUrl}</a>
          <div class="qr-preview"><img src="${qrApiUrl}"><br><a href="${qrApiUrl}" download="qr-${data.slug}.png" class="btn-main" style="display:inline-block; width:auto; padding: 6px 12px; margin-top: 10px;">Скачать QR-код</a></div>
        `;
        document.getElementById('upload-form').reset();
      } catch (err) {
        showError(statusBox, err.message);
      }
    });

    // Каталог
    async function loadCatalog() {
      const list = document.getElementById('catalog-list');
      list.innerHTML = 'Загрузка...';
      try {
        const res = await fetch('/api/dishes');
        const data = await res.json();
        list.innerHTML = '';
        Object.keys(data).forEach(slug => {
          const dish = data[slug];
          const dishUrl = `${window.location.origin}/?dish=${slug}`;
          const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(dishUrl)}`;
          
          list.innerHTML += `
            <div class="catalog-item">
              <div class="catalog-item-info">
                <strong>${dish.name}</strong>
                <span>Код: ${slug} | ${dish.calories} ккал</span>
              </div>
              <div class="catalog-item-actions">
                <a href="${dishUrl}" target="_blank" class="btn-small" style="background:#34c759">Открыть</a>
                <a href="${qrApiUrl}" target="_blank" download="qr-${slug}.png" class="btn-small" style="background:#007aff">QR-код</a>
                <button class="btn-small btn-danger" onclick="deleteDish('${slug}')">Удалить</button>
              </div>
            </div>
          `;
        });
        if (Object.keys(data).length === 0) list.innerHTML = '<p style="color:#8e8e93">Каталог пуст.</p>';
      } catch (err) {
        list.innerHTML = 'Ошибка загрузки каталога.';
      }
    }

    async function deleteDish(slug) {
      if (!confirm(`Точно удалить блюдо "${slug}"?`)) return;
      const statusBox = document.getElementById('catalog-status');
      
      try {
        const res = await fetch(`/api/dishes/${slug}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${currentAuthToken}` }
        });
        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.detail || 'Ошибка удаления');
        }
        statusBox.className = 'status-box success';
        statusBox.innerText = `Блюдо ${slug} удалено.`;
        loadCatalog();
      } catch (err) {
        showError(statusBox, err.message);
      }
    }

    function showError(element, msg) {
      element.className = 'status-box error';
      element.innerText = msg;
    }
  </script>
</body>
</html>
