<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель администратора — AR Меню</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f5f7;
      color: #1c1c1e;
      margin: 0;
      padding: 24px 16px;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p.sub { color: #6c6c70; font-size: 14px; margin: 0 0 24px; }
    .form-group { margin-bottom: 16px; }
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #3a3a3c;
    }
    input[type="text"], input[type="password"], input[type="number"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d1d6;
      border-radius: 10px;
      font-size: 14px;
    }
    textarea { resize: vertical; min-height: 80px; }
    input[type="file"] {
      width: 100%;
      padding: 8px;
      background: #f2f2f7;
      border-radius: 10px;
      font-size: 13px;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #007AFF;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
    .status-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      display: none;
      font-size: 14px;
    }
    .status-box.success { display: block; background: #e8f8ee; color: #1b6e38; }
    .status-box.error { display: block; background: #fdecea; color: #b71c1c; }
    .qr-preview {
      margin-top: 14px;
      text-align: center;
    }
    .qr-preview img {
      max-width: 180px;
      border-radius: 12px;
      border: 1px solid #e5e5ea;
      padding: 8px;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Импорт блюда в AR-меню</h1>
    <p class="sub">Загрузка оптимизированных .glb моделей (до 5 МБ) и валидация КБЖУ</p>

    <form id="upload-form">
      <div class="form-group">
        <label>Пароль администратора</label>
        <input type="password" name="admin_token" placeholder="По умолчанию: admin123" required>
      </div>

      <div class="form-group">
        <label>Код блюда для URL (slug на латинице, например: steak)</label>
        <input type="text" name="slug" pattern="^[a-z0-9_-]{2,50}$" placeholder="steak" required>
      </div>

      <div class="form-group">
        <label>Название блюда</label>
        <input type="text" name="name" maxlength="120" placeholder="Стейк Рибай" required>
      </div>

      <div class="grid-4">
        <div class="form-group">
          <label>Ккал</label>
          <input type="number" name="calories" min="1" max="5000" step="1" required>
        </div>
        <div class="form-group">
          <label>Белки (г)</label>
          <input type="number" name="protein" min="0" max="500" step="0.1" required>
        </div>
        <div class="form-group">
          <label>Жиры (г)</label>
          <input type="number" name="fat" min="0" max="500" step="0.1" required>
        </div>
        <div class="form-group">
          <label>Углеводы (г)</label>
          <input type="number" name="carbs" min="0" max="500" step="0.1" required>
        </div>
      </div>

      <div class="form-group">
        <label>Полный состав блюда (до 600 символов)</label>
        <textarea name="composition" maxlength="600" placeholder="Говядина зернового откорма, розмарин, чесночное масло, морская соль..." required></textarea>
      </div>

      <div class="form-group">
        <label>Основная 3D-модель целиком (.glb, до 5 МБ)</label>
        <input type="file" id="file-whole" name="file_whole" accept=".glb" required>
      </div>

      <div class="form-group">
        <label>3D-модель в разрезе (.glb, до 5 МБ — опционально)</label>
        <input type="file" id="file-cut" name="file_cut" accept=".glb">
      </div>

      <button type="submit" class="btn-submit">Сохранить блюдо и сгенерировать QR</button>
    </form>

    <div id="status-box" class="status-box"></div>
  </div>

  <script>
    const MAX_FILE_SIZE = 5 * 1024 * 1024; // 5 МБ

    document.getElementById('upload-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusBox = document.getElementById('status-box');
      statusBox.className = 'status-box';
      statusBox.style.display = 'none';

      const fileWhole = document.getElementById('file-whole').files[0];
      const fileCut = document.getElementById('file-cut').files[0];

      // Клиентская валидация формата и веса файла
      for (const f of [fileWhole, fileCut]) {
        if (!f) continue;
        if (!f.name.toLowerCase().endsWith('.glb')) {
          statusBox.className = 'status-box error';
          statusBox.innerText = 'Ошибка: допускаются только файлы формата .glb';
          return;
        }
        if (f.size > MAX_FILE_SIZE) {
          statusBox.className = 'status-box error';
          statusBox.innerText = `Ошибка: файл ${f.name} превышает лимит 5 МБ. Оптимизируйте модель в Blender.`;
          return;
        }
      }

      const formData = new FormData(e.target);
      try {
        const res = await fetch('/api/dishes', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Ошибка сохранения');

        const dishUrl = `${window.location.origin}/?dish=${data.slug}`;
        const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(dishUrl)}`;

        statusBox.className = 'status-box success';
        statusBox.innerHTML = `
          <strong>Блюдо «${data.name}» успешно сохранено в БД!</strong><br><br>
          Прямая ссылка для интеграции и QR:<br>
          <a href="${dishUrl}" target="_blank">${dishUrl}</a>
          <div class="qr-preview">
            <img src="${qrApiUrl}" alt="QR-код блюда">
          </div>
        `;
      } catch (err) {
        statusBox.className = 'status-box error';
        statusBox.innerText = err.message;
      }
    });
  </script>
</body>
</html>
