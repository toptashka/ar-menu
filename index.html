<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Меню</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    
    /* 1. ПРЯЧЕМ КНОПКУ VR, ЧТОБЫ НЕ ПЕРЕКРЫВАЛА УГЛЕВОДЫ */
    .a-enter-vr, .a-enter-ar { display: none !important; }

    #bottom-sheet {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px 20px 0 0; padding: 20px 20px 30px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.15); z-index: 9999;
    }
    .dish-title { font-size: 18px; font-weight: bold; margin: 0 0 10px 0; }
    .nutrition-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; text-align: center; }
    .val { font-size: 16px; font-weight: bold; color: #111; }
    .lbl { font-size: 12px; color: #666; }
    .hint { 
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%); 
      background: rgba(0,0,0,0.7); color: white; padding: 10px 20px; 
      border-radius: 20px; font-size: 14px; z-index: 9999; text-align: center; width: 80%;
      transition: opacity 0.5s;
    }
  </style>

  <script>
    // Скрипт для вращения пальцем (теперь крутит модель перед экраном)
    AFRAME.registerComponent('drag-rotate', {
      init: function () {
        let isDragging = false, prevX = 0;
        window.addEventListener('touchstart', e => { 
          if(!e.target.closest('#bottom-sheet')) { isDragging = true; prevX = e.touches[0].clientX; }
        });
        window.addEventListener('touchmove', e => {
          if (!isDragging) return;
          let delta = e.touches[0].clientX - prevX;
          prevX = e.touches[0].clientX;
          let rot = this.el.getAttribute('rotation');
          this.el.setAttribute('rotation', {x: rot.x, y: rot.y + delta * 0.5, z: rot.z});
        });
        window.addEventListener('touchend', () => isDragging = false);
      }
    });

    // Умная отвязка: переключает видимость между столом и экраном
    AFRAME.registerComponent('smart-detach', {
      init: function () {
        const marker = this.el;
        const markerDish = document.querySelector('#marker-dish');
        const cameraDishContainer = document.querySelector('#camera-dish-container');
        const hint = document.querySelector('.hint');
        
        let hasBeenFound = false;
        let detached = false;

        // Когда камера увидела маркер
        marker.addEventListener('targetFound', () => {
          if (!hasBeenFound) {
            hasBeenFound = true;
            hint.innerText = "Супер! Теперь отведи камеру от стола, чтобы рассмотреть блюдо.";
          }
        });

        // Когда ты убрал камеру от маркера
        marker.addEventListener('targetLost', () => {
          if (hasBeenFound && !detached) {
            detached = true;
            
            // Прячем модель на столе
            markerDish.setAttribute('visible', 'false');
            
            // Показываем модель, привязанную к экрану
            cameraDishContainer.setAttribute('visible', 'true');
            
            hint.innerText = "Блюдо отвязано! Крути его свайпом.";
            
            // Плавно скрываем подсказку через 4 секунды
            setTimeout(() => { hint.style.opacity = '0'; }, 4000);
          }
        });
      }
    });
  </script>
</head>
<body>
  <div class="hint">Наведи камеру на маркер на столе</div>

  <!-- Рамка сканирования возвращена (убрали uiScanning: no) -->
  <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="dish" src="./dish.glb"></a-asset-item>
    </a-assets>
    
    <!-- Камера телефона -->
    <a-camera position="0 0 0" look-controls="enabled: false">
      <!-- Модель 2: Привязана к камере, сначала невидима. Появится после отвязки -->
      <!-- Z="-1" означает, что она висит в 1 метре перед телефоном -->
      <a-entity id="camera-dish-container" visible="false" position="0 -0.2 -1" rotation="20 0 0">
        <a-gltf-model src="#dish" scale="0.5 0.5 0.5" drag-rotate></a-gltf-model>
      </a-entity>
    </a-camera>
    
    <!-- Маркер на столе. К нему привязан скрипт smart-detach -->
    <a-entity mindar-image-target="targetIndex: 0" smart-detach>
      <!-- Модель 1: Висит на маркере изначально -->
      <a-gltf-model id="marker-dish" src="#dish" position="0 0 0.1" rotation="90 0 0" scale="0.5 0.5 0.5"></a-gltf-model>
    </a-entity>
    
  </a-scene>

  <!-- Шторка КБЖУ. Кнопка VR её больше не перекрывает -->
  <div id="bottom-sheet">
    <p class="dish-title">Тестовое блюдо</p>
    <div class="nutrition-grid">
      <div><div class="val">540</div><div class="lbl">Ккал</div></div>
      <div><div class="val">26г</div><div class="lbl">Белки</div></div>
      <div><div class="val">28г</div><div class="lbl">Жиры</div></div>
      <div><div class="val">42г</div><div class="lbl">Углеводы</div></div>
    </div>
  </div>
</body>
</html>
