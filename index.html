<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Меню</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <link rel="stylesheet" href="./css/style.css?v=4">
  <script src="./js/app.js?v=4"></script>
</head>
<body>
  
  <div id="hint">Наведи камеру на маркер на столе</div>

  <!-- Меню выбора блюда (сверху) -->
  <div id="dish-selector">
    <button class="dish-btn active" onclick="switchDish('burger', this)">Бургер</button>
    <button class="dish-btn" onclick="switchDish('donut', this)">Пончик</button>
    <button class="dish-btn" onclick="switchDish('icecream', this)">Мороженое</button>
    <button class="dish-btn" onclick="switchDish('pancakes', this)">Блинчики</button>
  </div>

  <div id="action-buttons">
    <button id="btn-detach" class="btn" onclick="detachDish()">Забрать блюдо</button>
    <button id="btn-info" class="btn" onclick="toggleInfo()">Состав и КБЖУ</button>
    <button id="btn-reset" class="btn" onclick="resetAR()">Вернуть на маркер</button>
  </div>

  <a-scene id="ar-scene" mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    
    <a-entity id="marker-target" mindar-image-target="targetIndex: 0" manual-detach>
      <a-gltf-model id="marker-dish" src="./dish.glb" position="0 0 0.1" rotation="90 0 0" scale="0.5 0.5 0.5" drag-rotate></a-gltf-model>
    </a-entity>
  </a-scene>

  <div id="bottom-sheet">
    <button class="close-btn" onclick="toggleInfo()">×</button>
    <p class="dish-title">Загрузка...</p>
    <div class="nutrition-grid">
      <div><div id="val-cal" class="val">-</div><div class="lbl">Ккал</div></div>
      <div><div id="val-pro" class="val">-</div><div class="lbl">Белки</div></div>
      <div><div id="val-fat" class="val">-</div><div class="lbl">Жиры</div></div>
      <div><div id="val-carb" class="val">-</div><div class="lbl">Углеводы</div></div>
    </div>
  </div>

</body>
</html>
